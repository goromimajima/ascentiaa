<style>
/* Assets: file names = Figma layer names (a "/" in a layer name = sub-folder), all in ./assets
   Splash: "ChatGPT Image Sep 26, 2026, 09_05_37 PM 2.png" (399:954) · "ChatGPT Image Sep 26, 2026, 08_08_24 PM 1.png" (399:953)
   Login/bg: "ASCENTIA Logo.png" · "Ellipse 90.svg" · "Group 65.svg" · "battery.svg" · "wifi.svg" · "Toggle/Off.svg" · "Toggle/On.svg"
   Home & rooms: "ASCENTIA Mark.png" · "Weather Card.png" · "Photo · Fitness Room.png" · "3D Residence · Isometric Cut-away.svg"
     "3D Room · Bedroom.svg" · "3D Room · Living Room.svg" · "3D Room · Bathroom.svg" · "3D Room · Study Room.svg"
   Icons: "Icon/<name>.svg" — home concierge user chat pin door shield sun drop leaf thermo sparkles mic snow lock bulb building
     calendar users car steering shirt wrench waves chevronLeft chevronRight box dumbbell flag sliders blinds arrowRight minus plus
     wifi bed clock bell check wine phone send qr file sofa laptop glass mix alert tv zap power eyeoff
     (the gym tab icon is Figma's "iconmind:hotel-gym-outline-thin" -> saved as "Icon/iconmind-hotel-gym-outline-thin.svg", colon dropped) */
:root{
  --navy:#05152a; --text-muted:#b9c4d0; --text-dim:#8595a8;
  --gold-light:#e5c982; --gold:#c9a34a; --navy-btn:#0b2d55;
  --glass:linear-gradient(171deg,rgba(255,255,255,.15) 0%,rgba(255,255,255,.065) 32%,rgba(255,255,255,.035) 71%);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#111;font-family:Inter,system-ui,sans-serif;color:#fff;
  min-height:100vh;display:flex;align-items:center;justify-content:center}
.screen{position:relative;width:430px;height:932px;overflow:hidden;flex:none;background:var(--navy)}
.abs{position:absolute}

/* ---------- Splash ---------- */
.bg{left:-151px;top:-16px;width:581px;height:963px;overflow:hidden;pointer-events:none}
.bg img{position:absolute;left:-25.99%;top:0;width:165.75%;height:100%;max-width:none}
.layer{position:absolute;inset:0;transition:opacity .8s ease}
.logo{left:52px;width:327px;overflow:hidden;pointer-events:none;opacity:0;
  top:334px;height:197px;transition:opacity 1s ease,top 1s cubic-bezier(.65,0,.35,1),height 1s cubic-bezier(.65,0,.35,1)}
.logo img{position:absolute;left:0;top:0;width:100%;max-width:none;height:158.58%;transition:height 1s cubic-bezier(.65,0,.35,1)}
.dim{inset:0;opacity:0;transition:opacity 1s ease;
  background:linear-gradient(180deg,rgba(0,0,0,.7) 0%,rgba(0,0,0,.7) 58.173%,rgba(115,115,115,.7) 100%)}
.bgcolor{inset:0;background:linear-gradient(180deg,#07203f 0%,#092b54 24.8%,#0c3569 49.6%,#092b54 71.2%,#07203f 92.8%)}
.fade{opacity:0;transition:opacity .9s ease}
.panel-wrap{transform:translateY(40px);transition:opacity .9s ease,transform .9s cubic-bezier(.2,.8,.2,1)}

/* splash stages (data-stage on .screen): 1 bg · 2 dim+logo · 3 logo large · 4 welcome panel · 5 login */
.screen[data-stage="2"] .dim,.screen[data-stage="3"] .dim{opacity:1}
.screen[data-stage="2"] .logo,.screen[data-stage="3"] .logo,
.screen[data-stage="4"] .logo,.screen[data-stage="5"] .logo{opacity:1}
.screen[data-stage="3"] .logo{top:302px;height:261px}
.screen[data-stage="3"] .logo img{height:119.69%}
.screen[data-stage="4"] .logo,.screen[data-stage="5"] .logo{top:106px;height:261px}
.screen[data-stage="4"] .logo img,.screen[data-stage="5"] .logo img{height:119.69%}
.screen[data-stage="4"] .fade,.screen[data-stage="5"] .fade{opacity:1}
.screen[data-stage="4"] .panel-wrap,.screen[data-stage="5"] .panel-wrap{transform:none}
.screen[data-stage="5"] #splash{opacity:0;pointer-events:none}
#login{background:#05152a}
.screen:not([data-stage="4"]) .panel-wrap a{pointer-events:none}
@media (prefers-reduced-motion:reduce){.screen *{transition-duration:.01s!important}}
.shade-top{left:-74px;top:0;width:598px;height:407px;background:rgba(0,0,0,.5);filter:blur(50px)}
.shade-bot{left:-74px;top:657px;width:598px;height:407px;background:rgba(0,0,0,.5);filter:blur(50px)}
.panel{left:16px;top:610px;width:398px;height:278px;border-radius:20px;border-bottom:1px solid #fff;
  box-shadow:0 0 42px rgba(0,0,0,.58),inset 0 30px 12px -21px rgba(255,255,255,.32);
  background:linear-gradient(180deg,rgba(255,255,255,0),rgba(255,255,255,.2))}
.welcome{left:0;right:0;top:657px;text-align:center;font-size:24px;font-weight:600}

/* ---------- Login ---------- */

.or{position:absolute;left:40px;top:672px;width:350px;display:flex;align-items:center;justify-content:center;gap:12px;
  font-size:11px;font-weight:600;letter-spacing:1.1px;color:var(--text-dim)}

.bio{position:absolute;left:40px;top:707px;width:350px;display:flex;gap:14px;justify-content:center}

/* ---------- App pages (Home, Notifications, Schedule, Concierge, Smart Home) ---------- */

.text-title{font:600 15px Inter,system-ui,sans-serif;color:#fff}.text-body{font:12px Inter,system-ui,sans-serif;color:#b9c4d0}.text-caption{font:11px Inter,system-ui,sans-serif;color:#8595a8}

<body>
<main class="screen" id="app" data-stage="1" aria-label="Ascentia">

  <!-- Splash 01-04 as one continuous flow -->
  <div class="layer" id="splash">
    <div class="abs bgcolor"></div>
    <div class="abs bg"><img alt="" src="assets/ChatGPT Image Sep 26, 2026, 09_05_37 PM 2.png"></div>
    <div class="abs dim"></div>
    <div class="abs logo"><img alt="Ascentia" src="assets/ASCENTIA Logo.png" onerror="this.onerror=null;this.src='assets/ChatGPT Image Sep 26, 2026, 08_08_24 PM 1.png'"></div>

    <div class="abs fade" style="inset:0">
      <div class="abs shade-bot"></div>
      <div class="abs shade-top"></div>
    </div>
    <div class="abs fade panel-wrap" style="inset:0">
      <div class="abs panel"></div>
      <p class="abs welcome">WELCOME</p>
      <p class="abs tagline">Your Luxury Living Connected</p>
      <a class="abs cta" href="#login" data-go="5">Get Started</a>
      <a class="abs login-link" href="#login" data-go="5">Login</a>
    </div>
  </div>

  <!-- Login -->
  <div class="layer page" id="login">
  <div class="abs orb"><img alt="" src="assets/Ellipse 90.svg"></div>
  <div class="abs glow"><img alt="" src="assets/Group 65.svg"></div>
  <div class="abs status">
    <span class="t">9:34</span>
    <span class="r"><img alt="" src="assets/wifi.svg"><img alt="" src="assets/battery.svg"></span>
  </div>
  <div class="abs brand"><img alt="Ascentia Luxury Condominium" src="assets/ASCENTIA Logo.png"></div>
  <h1>Welcome back, Resident</h1>
  <p class="abs sub">Sign in to access your residence</p>

  <form onsubmit="return false">
    <div class="field">
      <label for="rid">RESIDENT ID OR EMAIL</label>
      <div class="input active">
        <img alt="" data-icon="user" src="assets/user.svg">
        <input id="rid" type="text" value="nara@ascentia.co.th" autocomplete="username">
      </div>
    </div>
    <div class="field">
      <label for="pw">PASSWORD</label>
      <div class="input">
        <img alt="" data-icon="lock" src="assets/lock.svg">
        <input id="pw" type="password" value="1234567890" autocomplete="current-password">
        <button type="button" id="eye" aria-label="Show password"><img alt="" data-icon="eyeoff" src="assets/eyeoff.svg"></button>
      </div>
    </div>
  </form>

  <div class="row">
    <button class="toggle" id="remember" role="switch" aria-checked="false" aria-label="Remember me"><img alt="" src="assets/Toggle/Off.svg"></button>
    <span>Remember me</span>
    <a href="#">Forgot password?</a>
  </div>

  <button class="btn primary">Log In</button>
  <div class="or"><i></i>OR<i></i></div>
  <div class="bio">
    <a class="btn secondary" href="#">Face ID</a>
    <a class="btn secondary" href="#">Fingerprint</a>
  </div>
  <p class="abs help">Need help?  Contact Concierge  ·  02 000 8888</p>
</div>
</main>

<script>
  const pw = document.getElementById('pw'), eye = document.getElementById('eye');
  eye.addEventListener('click', () => {
    const show = pw.type === 'password';
    pw.type = show ? 'text' : 'password';
    eye.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
  });
  const rememberTg = document.getElementById('remember');
  rememberTg.addEventListener('click', () => {
    const on = rememberTg.getAttribute('aria-checked') !== 'true';
    rememberTg.setAttribute('aria-checked', on);
    {const im=rememberTg.firstElementChild;im.dataset.orig='';delete im.dataset.built;delete im.dataset.try;delete im.dataset.fig;CHAINS.delete(im);im.src = on ? 'assets/Toggle/On.svg' : 'assets/Toggle/Off.svg';}
  });

  // Continuous flow: 01 -> 02 -> 03 -> 04, then Get Started / Login -> Login
  const app = document.getElementById('app');
  let stage = 1, timer;
  const go = n => { stage = n; app.dataset.stage = n; clearTimeout(timer); schedule(); };
  const schedule = () => { if (stage < 4) timer = setTimeout(() => go(stage + 1), stage === 1 ? 1600 : 1800); };
  app.addEventListener('click', e => {
    const t = e.target.closest('[data-go]');
    if (t) { e.preventDefault(); go(+t.dataset.go); }
    else if (stage < 4 && !e.target.closest('#login')) go(stage + 1);   // tap to skip ahead
  });
  schedule();

/* ===== App pages ===== */
const $=(q,r=document)=>r.querySelector(q),Icon=(n,c='')=>{const f=({back:'chevronLeft',chevron:'chevronRight',gym:'iconmind:hotel-gym-outline-thin'})[n]||n;return `<img class="${c}" alt="" data-icon="${f}" src="assets/${f}.svg">`};
const navigate=id=>{app.querySelectorAll('.page').forEach(p=>p.classList.toggle('on',p.id===id));if(id==='ai-concierge'){const c=$('#ai-concierge .content');c.style.scrollBehavior='auto';c.scrollTop=c.scrollHeight;c.style.scrollBehavior=''}};
const createPage=(id,h)=>{const d=document.createElement('div');d.className='page';d.id=id;d.innerHTML=h;app.appendChild(d)};
const G='#8cc9a6',Y='#e5c982',B='#7cc8ff',R='#d98b80',GY='#a8afb8';
const Badge=(t,c)=>`<span class="badge" style="--c:${c}">${t}</span>`,Toggle=on=>`<button class="toggle-switch${on?' on':''}"></button>`;
const IconPlate=(i,o,s='')=>`<div class="icon-plate${o?' o':''}" style="${s}">${Icon(i)}</div>`;
const Choice=(o,s)=>`<div class="choice frame-row" style="gap:6px">${o.map((x,k)=>`<span class="glass chip${k==s?' on':''}">${x}</span>`).join('')}</div>`;
const Menubar=`<div class="menubar">${[['home','Home'],['concierge','Service'],['gym','Facility'],['chat','Community'],['user','Profile']].map(([i,l],k)=>`<a class="${k?'':'on'}" ${k==0?'data-n="home"':k==3?'data-n="ai-concierge"':''}>${Icon(i)}${l}</a>`).join('')}</div>`;
const TopBar=(t,s,b,r='')=>`<div class="frame-row" style="height:56px;gap:14px"><a class="glass back-button" data-n="${b}">${Icon('back')}</a><div style="flex:1"><div style="font:600 24px Inter,system-ui,sans-serif;letter-spacing:-.36px">${t}</div><div class="text-body">${s}</div></div>${r}</div>`;
const pl44='width:44px;height:44px;border-radius:14px';

// --- Home ---
const StatusCard=(i,l,v,c)=>`<div class="glass" style="flex:1;padding:13px;border-radius:20px;display:flex;flex-direction:column;gap:9px">${Icon(i,'icon-20')}<span style="font:600 10px Inter,system-ui,sans-serif;letter-spacing:.8px;color:#8595a8">${l}</span><span style="font:600 14.5px Inter,system-ui,sans-serif;display:flex;align-items:center;gap:7px"><i class="live-dot" style="background:${c}"></i>${v}</span></div>`;
const SmartHomeTile=(i,v,l,on)=>`<div class="smart-home-tile"><div class="frame-row" style="justify-content:space-between">${Icon(i,'icon-20')}${Toggle(on)}</div><b>${v}</b><span>${l}</span></div>`;
const UpdateCard=(i,o,t,tm,x)=>`<a class="glass frame-row" data-n="notifications" style="padding:16px;border-radius:20px;gap:14px;cursor:pointer">${IconPlate(i,o,pl44)}<div class="frame-column" style="gap:4px;flex:1"><div class="frame-row" style="gap:8px"><b class="text-title">${t}</b><span style="color:#e5c982;font:600 11px Inter,system-ui,sans-serif">${tm}</span></div><div class="text-body" style="line-height:17px">${x}</div></div>${Icon('chevron','icon-trailing')}</a>`;
const ScheduleRow=(t,a,n,s,i,f)=>`<div class="frame-row" style="padding:12px 10px;gap:14px;${n?'cursor:pointer':''}" ${n?`data-n="${n}"`:''}><div style="width:50px;text-align:center"><div style="font:600 16px Inter,system-ui,sans-serif;color:${f?'#e5c982':'#fff'}">${t}</div><div style="font:600 10px Inter,system-ui,sans-serif;letter-spacing:.8px;color:#8595a8">${a}</div></div><i style="width:2px;height:36px;border-radius:1px;background:${f?'linear-gradient(#e5c982,#c9a34a)':'rgba(255,255,255,.18)'}"></i><div style="flex:1"><div class="text-title">${n?'Fitness Room':s[0]}</div><div class="text-body">${s[1]}</div></div>${IconPlate(i,f,'width:36px;height:36px;border-radius:12px')}</div>`;
createPage('home',`<div class="content"><div class="content-inset" style="padding:69px 16px 130px">
<div class="frame-row" style="justify-content:space-between;padding:0 4px;height:34px"><span class="ascentia-wordmark">ASCENTIA</span><a class="glass notifications-button gold-outline" data-n="notifications">${Icon('bell')}<i></i></a></div>
<div style="padding:21px 4px 0"><div class="text-body" style="font-size:16px">Good Morning,</div><div style="font:600 30px Inter,system-ui,sans-serif;letter-spacing:-.6px">Naru Duangmet</div><div class="frame-row text-body" style="gap:6px;font-weight:500;margin-top:4px">${Icon('pin','icon-14')}Residence A-1203 · Tower A · Sat 26 Sep</div></div>
<div class="frame-row" style="gap:10px;margin:20px 4px 0">${StatusCard('home','RESIDENCE','At Home',G)}${StatusCard('door','HOME STATUS','All Secure',G)}${StatusCard('shield','SECURITY','Armed',Y)}</div>
<div class="glass weather-card" style="margin-top:20px"><img src="assets/Weather Card.png" alt=""><i></i><div style="position:absolute;left:21px;top:21px;width:28px">${Icon('sun','weather-sun')}</div><div style="position:absolute;left:17px;top:51px;font:300 56px Inter,system-ui,sans-serif;letter-spacing:-2.8px">32°<span style="font-size:22px;letter-spacing:0;color:#b9c4d0;margin-left:6px">C</span></div><b style="position:absolute;left:21px;top:125px;font:600 14px Inter,system-ui,sans-serif">Bangkok · Sunny</b><div class="weather-meta"><span>${Icon('drop','icon-14')}Humidity 62%</span><span>${Icon('leaf','icon-14')}AQI 42 · Good</span><span>${Icon('thermo','icon-14')}H 34° L 27°</span></div></div>
<a class="glass gold-outline frame-column" data-n="ai-concierge" style="margin-top:22px;padding:16px;gap:14px;cursor:pointer"><div class="frame-row">${IconPlate('sparkles',1,'width:42px;height:42px')}<div style="flex:1"><div class="text-title" style="font-size:16px">AI Concierge</div><div class="text-body">Type or speak — we’ll take care of it.</div></div>${IconPlate('mic',0)}</div><div class="frame-row" style="gap:8px">${['Bring my car','Gym at 6 PM','Housekeeping'].map(c=>`<span class="glass chip" style="font-size:12px;padding:7px 12px">${c}</span>`).join('')}</div></a>
<div class="frame-row" style="justify-content:space-between;margin:22px 4px 14px"><span class="section-title" style="padding:0">Residence Status</span><span class="section-link" data-n="smart-home-3d">Smart Home</span></div>
<div class="glass frame-column" style="padding:18px;border-radius:26px"><div class="frame-row" style="flex-wrap:wrap;gap:10px">${SmartHomeTile('thermo','24°C','Temperature',0)}${SmartHomeTile('snow','Cool · 24°','Air Conditioning',0)}${SmartHomeTile('lock','Locked','Door Lock',1)}${SmartHomeTile('bulb','3 On','Lights',1)}</div><a class="btngold button-gold-outline" data-n="smart-home-3d">Open Smart Home</a></div>
<div class="section-title" style="margin:22px 0 14px">Explore</div><div class="frame-row" style="gap:11px">${[['building','Facilities'],['calendar','Booking'],['concierge','Service'],['users','Guest']].map(([i,l])=>`<a class="glass quick-action">${IconPlate(i,1)}${l}</a>`).join('')}</div>
<div class="frame-row" style="justify-content:space-between;margin:22px 4px 14px"><span class="section-title" style="padding:0">Quick Service</span><span class="section-link">All services</span></div><div class="frame-row" style="justify-content:space-between">${[['car','Valet'],['sparkles','Housekeeping'],['steering','Chauffeur'],['shirt','Laundry'],['wrench','Maintenance']].map(([i,l])=>`<a class="quick-service-item"><div class="glass">${Icon(i)}</div>${l}</a>`).join('')}</div>
<div class="frame-row" style="justify-content:space-between;margin:22px 4px 14px"><span class="section-title" style="padding:0">Today's Updates</span><span class="section-link" data-n="notifications">View All</span></div><div class="frame-column" style="gap:12px">${UpdateCard('waves',1,'Pool Maintenance','10:00 – 14:00','Infinity Pool (Floor 20) is closed today for maintenance.')}${UpdateCard('box',0,'Parcel Arrived','08:12','2 parcels are waiting for you at the Concierge Desk.')}</div>
<div class="frame-row" style="justify-content:space-between;margin:22px 4px 14px"><span class="section-title" style="padding:0">Today's Schedule</span><span class="section-link">Calendar</span></div>
<div class="glass" style="padding:8px">${ScheduleRow('10:00','AM','schedule-detail',['','Floor 5 · 1 guest'],'dumbbell',1)}<i class="divider"></i>${ScheduleRow('02:00','PM',0,['Housekeeping','Full service · 2 hrs'],'sparkles')}<i class="divider"></i>${ScheduleRow('06:00','PM',0,['Golf Course','Sky Driving Range · 2 guests'],'flag')}</div></div></div>${Menubar}`);

// --- Notifications ---
const NotificationCard=(i,o,t,tm,x,b,n)=>`<div class="glass frame-row" ${n?`data-n="${n}"`:''} style="align-items:flex-start;gap:14px;padding:16px;border-radius:20px">${IconPlate(i,o,pl44)}<div class="frame-column" style="gap:5px;flex:1"><div class="frame-row" style="justify-content:space-between"><b class="text-title">${t}</b><span class="text-caption" style="font-weight:500">${tm}</span></div><div class="text-body" style="line-height:17px">${x}</div>${b||''}</div></div>`;
createPage('notifications',`<div class="content"><div class="content-inset frame-column" style="gap:16px">${TopBar('Notifications',"Today's updates & alerts",'home',`<div class="glass back-button">${Icon('check')}</div>`)}
<div class="frame-row fl" style="gap:8px">${['All','Building','Services','Bookings'].map((c,k)=>`<span class="glass chip${k?'':' on'}">${c}</span>`).join('')}</div><div class="section-title">Today</div>
${NotificationCard('waves',1,'Pool Maintenance','08:00','Infinity Pool (Floor 20) is closed 10:00 – 14:00 for scheduled maintenance.',Badge('CLOSED · MAINTENANCE',R))}
${NotificationCard('box',0,'Parcel Arrived','08:12','2 parcels from Central Online are waiting at the Concierge Desk, Lobby G.')}
${NotificationCard('sparkles',0,'Housekeeping Confirmed','07:45','Full service scheduled today at 02:00 PM. Staff: Khun Malee.',Badge('CONFIRMED',G),'schedule-detail')}
${NotificationCard('wine',1,'Wine & Dinner Night','07:30','RSVP now for Friday 2 Oct, Sky Lounge — 12 seats left.',Badge('UPCOMING',Y))}
<div class="section-title" style="margin-top:2px">Yesterday</div>${NotificationCard('wrench',0,'Maintenance Completed','Fri','Bedroom air conditioning has been serviced. Rate your experience.',Badge('COMPLETED',GY))}</div></div>${Menubar}`);

// --- Schedule detail ---
const dr=(i,o,l,v)=>`<div class="frame-row" style="padding:11px 8px;gap:14px">${IconPlate(i,o,'width:36px;height:36px;border-radius:12px')}<div><div style="font:600 10px Inter,system-ui,sans-serif;letter-spacing:.8px;color:#8595a8">${l}</div><div style="font:500 15px Inter,system-ui,sans-serif">${v}</div></div></div>`;
createPage('schedule-detail',`<div class="content"><div class="content-inset frame-column" style="gap:18px">${TopBar('Fitness Room','Today · Booking details','home')}
<div class="glass" style="height:210px;border-radius:26px;overflow:hidden;border-color:rgba(255,255,255,.25)"><img src="assets/Photo · Fitness Room.png" alt="" style="width:100%;height:100%;object-fit:cover"><i style="position:absolute;inset:0;background:linear-gradient(180deg,rgba(6,26,51,0),rgba(6,26,51,.24) 50%,rgba(6,26,51,.8))"></i><span style="position:absolute;left:13px;top:25px">${Badge('CONFIRMED',G)}</span><span class="text-body" style="position:absolute;left:18px;bottom:16px;font-weight:500;font-size:13px">Floor 5 · Tower A</span></div>
<div class="glass" style="padding:10px">${[dr('calendar',0,'DATE','Saturday, 26 September'),dr('clock',1,'TIME','10:00 – 11:00 AM'),dr('pin',0,'LOCATION','Floor 5, Tower A'),dr('users',0,'GUESTS','1 Person'),dr('file',0,'BOOKING ID','ASC-FT-260910')].join('<i class="divider"></i>')}</div>
<div class="glass gold-outline frame-row" style="padding:16px;gap:16px;border-radius:22px">${IconPlate('qr',1,'width:64px;height:64px;border-radius:16px')}<div class="frame-column" style="gap:4px"><div class="text-title">Digital Access Pass</div><div class="text-body" style="line-height:17px">Tap your phone at the gym entrance reader.</div></div></div>
<div class="glass" style="align-self:center;width:169px;height:54px;border-radius:18px;display:flex;align-items:center;justify-content:center;font:600 16px Inter,system-ui,sans-serif;letter-spacing:.48px;cursor:pointer">Add to Calendar</div></div></div>${Menubar}`);

createPage('ai-concierge',`<div class="abs orb"><img alt="" src="assets/Ellipse 90.svg"></div><div class="abs glow"><img alt="" src="assets/Group 65.svg"></div><div class="chat-header frame-row"><a class="glass back-button" data-n="home">${Icon('back')}</a><div class="glass gold-outline" style="width:48px;height:48px;border-radius:24px;display:flex;align-items:center;justify-content:center"><img src="assets/ASCENTIA Mark.png" alt="" style="width:30px"></div><div style="flex:1"><div style="font:600 20px Inter,system-ui,sans-serif;letter-spacing:-.2px">AI Concierge</div><div class="text-body"><i class="live-dot"></i> Online · replies instantly</div></div><div class="glass back-button">${Icon('phone')}</div></div><div class="content chat-scroll"><div class="content-inset frame-column" style="gap:16px;padding:20px 20px 24px">
<div class="text-caption" style="text-align:center;letter-spacing:1.4px;font-weight:600;font-size:10px">TODAY · 09:41</div>
${AIBubble('Good morning, Nara. How may I assist you today? You can type or speak your request.')}
<div class="frame-row" style="flex-wrap:wrap;gap:8px">${['Bring my car','Book the gym at 6 PM','I need housekeeping tomorrow'].map(c=>`<span class="glass chip suggestion-chip" style="font-size:12px;padding:7px 12px">${c}</span>`).join('')}</div>
${me('Bring my car.')}${AIBubble(`Your BMW 7 Series is parked at P2. Shall I send it to the Main Lobby?<div class="vehicle-card">${IconPlate('car',1)}<div><div class="text-title" style="font-size:14px">BMW 7 Series</div><div class="text-body">Parking P2 · Bay B24</div><div class="text-body" style="color:#e5c982;font-weight:500">Drop-off: Main Lobby</div></div></div><div class="frame-row" style="gap:8px"><span class="chip chip-selected suggestion-chip" style="font-size:12px">Confirm Valet Request</span><span class="glass chip" style="font-size:12px">Change</span></div>`)}
${me('Confirm Valet Request.')}${AIBubble('Your valet request has been submitted. Your BMW will arrive at the Main Lobby in about 6 minutes.'+Badge('SUBMITTED',Y))}<div id="typing-indicator" class="glass typing"><i></i><i></i><i></i></div></div></div>
<div class="glass composer">${Icon('plus')}<input id="composer-input" placeholder="Message your concierge…">${Icon('mic')}<button id="composer-send">${Icon('send')}</button></div>`);

  else if(BUILTIN_ICONS[i.dataset.icon]&&!i.dataset.built){i.dataset.built=1;i.src=BUILTIN_ICONS[i.dataset.icon]}
  else if(/Toggle\/(On|Off)\.svg$/.test(raw)&&!i.dataset.built){i.dataset.built=1;const on=/On\.svg$/.test(raw);   // login toggle drawn in code if no file is found
    i.src='data:image/svg+xml;utf8,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="52" height="30" viewBox="0 0 52 30"><rect width="52" height="30" rx="15" fill="${on?'#d4b062':'#ffffff'}" fill-opacity="${on?1:.18}"/><circle cx="${on?37:15}" cy="15" r="12" fill="#fff"/></svg>`)}},true);
// CSS background (page glow) can't fall back on its own, so locate the file and expose it as a variable
(()=>{const n='Group 65.svg',c=ASSET_DIRS.map(d=>`assets/${d}${n}`);let k=0;
  const t=()=>{if(k>=c.length)return;const im=new Image();im.onload=()=>document.documentElement.style.setProperty('--glow-url',`url("${c[k]}")`);im.onerror=()=>{k++;t()};im.src=c[k]};t()})();
// images that failed before this handler existed
document.querySelectorAll('img').forEach(i=>{if(i.complete&&!i.naturalWidth)i.dispatchEvent(new Event('error'))});
</script>
</body>
